# Docker Compose for Timesheet Backend
# Services:
#   - db       (PostgreSQL 15)
#   - backend  (FastAPI / Uvicorn)
#
# Usage:
#   docker compose up          # build and run locally
#   docker compose up db       # start only the database
#   docker compose up --build  # rebuild images before starting

version: "3.9"

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: timesheet
      POSTGRES_DB: timesheet
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DB_HOST: db
      ENVIRONMENT: development
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure

volumes:
  pgdata:
